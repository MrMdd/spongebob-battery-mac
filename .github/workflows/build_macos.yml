name: Build macOS Menu Bar App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Universal macOS Application (.app)
        run: |
          set -e
          echo "=== 1. Creating App Bundle Structure ==="
          APP_NAME="SpongeBobBattery"
          BUNDLE="$APP_NAME.app"
          rm -rf "$BUNDLE" output
          mkdir -p "$BUNDLE/Contents/MacOS"
          mkdir -p "$BUNDLE/Contents/Resources"

          echo "=== 2. Compiling Asset Catalog (Icons) ==="
          actool Assets.xcassets \
                 --compile "$BUNDLE/Contents/Resources" \
                 --platform macosx \
                 --minimum-deployment-target 13.0 \
                 --output-format human-readable-text

          echo "=== 3. Compiling Swift Code (Universal Binary: ARM64 + x86_64) ==="
          SDK_PATH=$(xcrun --show-sdk-path --sdk macosx)
          
          # ARM64 (Apple Silicon M1/M2/M3/M4)
          swiftc -O -parse-as-library \
                 -target arm64-apple-macos13.0 \
                 -sdk "$SDK_PATH" \
                 -framework SwiftUI -framework IOKit -framework ServiceManagement -framework AppKit \
                 BatteryMonitor.swift SpongeBobBatteryApp.swift \
                 -o "$BUNDLE/Contents/MacOS/${APP_NAME}_arm64"

          # x86_64 (Intel Mac)
          swiftc -O -parse-as-library \
                 -target x86_64-apple-macos13.0 \
                 -sdk "$SDK_PATH" \
                 -framework SwiftUI -framework IOKit -framework ServiceManagement -framework AppKit \
                 BatteryMonitor.swift SpongeBobBatteryApp.swift \
                 -o "$BUNDLE/Contents/MacOS/${APP_NAME}_x86_64"

          # Create Universal Binary (Works on ALL Macs)
          lipo -create "$BUNDLE/Contents/MacOS/${APP_NAME}_arm64" \
                       "$BUNDLE/Contents/MacOS/${APP_NAME}_x86_64" \
               -output "$BUNDLE/Contents/MacOS/$APP_NAME"
          
          rm "$BUNDLE/Contents/MacOS/${APP_NAME}_arm64" "$BUNDLE/Contents/MacOS/${APP_NAME}_x86_64"
          chmod +x "$BUNDLE/Contents/MacOS/$APP_NAME"

          echo "=== 4. Copying Info.plist & PkgInfo ==="
          cp Info.plist "$BUNDLE/Contents/Info.plist"
          echo "APPL????" > "$BUNDLE/Contents/PkgInfo"

          echo "=== 5. Ad-Hoc Code Signing ==="
          codesign --force --deep --sign - "$BUNDLE"

          echo "=== 6. Packaging into Output ZIP ==="
          mkdir -p output
          cp -R "$BUNDLE" output/
          cd output
          zip -r -y SpongeBobBattery-macOS.zip "$BUNDLE"
          cd ..
          echo "Build Complete!"

      - name: Launch App & Capture Screenshots
        run: |
          echo "=== Installing Pillow for Image Processing ==="
          python3 -m pip install --upgrade pip Pillow

          echo "=== Launching Application on macOS Runner ==="
          open output/SpongeBobBattery.app
          sleep 4

          echo "=== 1. Taking Desktop Screenshot ==="
          screencapture -x output/1_desktop_menubar.png

          echo "=== 2. Opening Menu & Taking Dropdown Screenshot ==="
          # Use AppleScript to click the menu bar item to reveal the dropdown
          osascript -e '
          tell application "System Events"
            tell process "SpongeBobBattery"
              try
                click menu bar item 1 of menu bar 2
              on error
                try
                  click menu bar item 1 of menu bar 1
                end try
              end try
            end tell
          end tell' || true

          sleep 2
          screencapture -x output/2_menu_opened.png

          echo "=== 3. Generating Cropped Zoomed Views ==="
          python3 -c "
          from PIL import Image
          import os

          # Crop 1: Menu Bar Top Right
          if os.path.exists('output/1_desktop_menubar.png'):
              img = Image.open('output/1_desktop_menubar.png')
              w, h = img.size
              crop_corner = img.crop((max(0, w - 800), 0, w, min(100, h)))
              crop_corner.save('output/3_menubar_icon_zoom.png')

          # Crop 2: Opened Dropdown Menu
          if os.path.exists('output/2_menu_opened.png'):
              img2 = Image.open('output/2_menu_opened.png')
              w2, h2 = img2.size
              crop_menu = img2.crop((max(0, w2 - 600), 0, w2, min(500, h2)))
              crop_menu.save('output/4_dropdown_menu_zoom.png')

          print('All zoomed crops created successfully!')
          "

      - name: Upload .app & Screenshots Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpongeBobBattery-macOS
          path: |
            output/SpongeBobBattery-macOS.zip
            output/SpongeBobBattery.app
            output/*.png
