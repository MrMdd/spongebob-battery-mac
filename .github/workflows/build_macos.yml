name: Build macOS Menu Bar App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Universal macOS Application (.app)
        run: |
          set -e
          echo "=== 1. Creating App Bundle Structure ==="
          APP_NAME="SpongeBobBattery"
          BUNDLE="$APP_NAME.app"
          rm -rf "$BUNDLE" output
          mkdir -p "$BUNDLE/Contents/MacOS"
          mkdir -p "$BUNDLE/Contents/Resources"

          echo "=== 2. Compiling Asset Catalog (Icons) ==="
          actool Assets.xcassets \
                 --compile "$BUNDLE/Contents/Resources" \
                 --platform macosx \
                 --minimum-deployment-target 13.0 \
                 --output-format human-readable-text

          echo "=== 3. Compiling Swift Code (Universal Binary: ARM64 + x86_64) ==="
          SDK_PATH=$(xcrun --show-sdk-path --sdk macosx)
          
          # ARM64 (Apple Silicon M1/M2/M3/M4)
          swiftc -O -parse-as-library \
                 -target arm64-apple-macos13.0 \
                 -sdk "$SDK_PATH" \
                 -framework SwiftUI -framework IOKit -framework ServiceManagement -framework AppKit \
                 BatteryMonitor.swift SpongeBobBatteryApp.swift \
                 -o "$BUNDLE/Contents/MacOS/${APP_NAME}_arm64"

          # x86_64 (Intel Mac)
          swiftc -O -parse-as-library \
                 -target x86_64-apple-macos13.0 \
                 -sdk "$SDK_PATH" \
                 -framework SwiftUI -framework IOKit -framework ServiceManagement -framework AppKit \
                 BatteryMonitor.swift SpongeBobBatteryApp.swift \
                 -o "$BUNDLE/Contents/MacOS/${APP_NAME}_x86_64"

          # Create Universal Binary (Works on ALL Macs)
          lipo -create "$BUNDLE/Contents/MacOS/${APP_NAME}_arm64" \
                       "$BUNDLE/Contents/MacOS/${APP_NAME}_x86_64" \
               -output "$BUNDLE/Contents/MacOS/$APP_NAME"
          
          rm "$BUNDLE/Contents/MacOS/${APP_NAME}_arm64" "$BUNDLE/Contents/MacOS/${APP_NAME}_x86_64"
          chmod +x "$BUNDLE/Contents/MacOS/$APP_NAME"

          echo "=== 4. Copying Info.plist & PkgInfo ==="
          cp Info.plist "$BUNDLE/Contents/Info.plist"
          echo "APPL????" > "$BUNDLE/Contents/PkgInfo"

          echo "=== 5. Ad-Hoc Code Signing ==="
          codesign --force --deep --sign - "$BUNDLE"

          echo "=== 6. Packaging into Output ZIP ==="
          mkdir -p output
          cp -R "$BUNDLE" output/
          cd output
          zip -r -y SpongeBobBattery-macOS.zip "$BUNDLE"
          cd ..
          echo "Build Complete!"

      - name: Generate Showcase Preview & Live Screenshot
        run: |
          echo "=== 1. Generating 2x Retina Showcase Preview (All States) ==="
          SDK_PATH=$(xcrun --show-sdk-path --sdk macosx)
          swiftc -O -parse-as-library \
                 -sdk "$SDK_PATH" \
                 -framework SwiftUI -framework AppKit \
                 ShowcaseGenerator.swift \
                 -o generate_showcase
          
          ./generate_showcase

          echo "=== 2. Launching App & Capturing Desktop Screenshot ==="
          open output/SpongeBobBattery.app
          sleep 4
          screencapture -x output/screenshot_desktop.png
          echo "All previews generated successfully!"

      - name: Upload .app & Previews Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SpongeBobBattery-macOS
          path: |
            output/SpongeBobBattery-macOS.zip
            output/SpongeBobBattery.app
            output/*.png
